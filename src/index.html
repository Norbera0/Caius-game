   bottom edge of the screen). Screen scale s = 1 / (1 + K * z).
   ========================================================================== */

/* ==========================================================================
   2. STATE
   ========================================================================== */
const canvas = document.getElementById("game");
let ctx = canvas.getContext("2d"); // swapped briefly while pre-drawing cached scenery

/** Layout recomputed on every resize; all drawing reads from here. */
const view = { w: 0, h: 0, dpr: 1, vx: 0, horizonY: 0, laneW: 0, safe: { top: 0, right: 0, bottom: 0, left: 0 } };

/** Run state. `speed` is the single variable that drives all scrolling. Filled by resetRun(). */
const state = {};

/** Debug switches from the URL: ?speed=N fixes the speed, ?seed=N fixes the spawner, ?nospawn disables it. */
const params = new URLSearchParams(location.search);
const debug = {
  speed: parseFloat(params.get("speed")),
  seed: parseInt(params.get("seed"), 10),
  noSpawn: params.has("nospawn"),
  play: params.has("play"),       // skip the Title screen
};

/**
 * Put every run field back to its start value. Called at boot and on every retry,
 * so a restart can never inherit state from the previous run.
 * @param {number} [seed] spawner seed; random when omitted
 */
function resetRun(seed) {
  const s = Number.isFinite(seed) ? seed : (Math.random() * 2 ** 32) >>> 0;
  Object.assign(state, {
    running: true,
    crashed: false,
    time: 0,                    // seconds survived
    speed: Number.isFinite(debug.speed) ? debug.speed : CONFIG.baseSpeed,
    scroll: 0,                  // total z distance travelled
    runPhase: 0,                // drives the dog's stride
    lane: CONFIG.startLane,     // target lane (logical, always an integer)
    laneVis: CONFIG.startLane,  // drawn lane position (float while sliding)
    slideFrom: CONFIG.startLane,
    slideT: 1,                  // slide progress 0..1; 1 = not sliding
    queue: [],                  // buffered lane moves (-1 / +1)
    grounded: true,
    jumpT: 0,                   // seconds since take-off
    jumpY: 0,                   // height above ground, in lane widths
    tilt: 0,                    // lean into lane changes, radians
    squashX: 1,                 // landing squash
    squashY: 1,
    landT: Infinity,            // seconds since the last landing
    treatPoints: 0,             // bonus points from treats
    treatCount: 0,              // treats collected this run
    treats: [],                 // { lane, wz } treats not yet collected
    penguins: [],               // { lane, wz } banana penguins not yet collected
    penguinCount: 0,            // banana penguins collected this run
    nextPenguinWz: CONFIG.penguin.firstAfter, // no penguin before this world distance
    reach: allLanes(),          // lanes a player can be in after the last spawned row
    seed: s,
    rng: mulberry32(s),
    spawnEnabled: !debug.noSpawn,
    obstacles: [],              // { type, lane, wz } — wz = world distance along the track
    nextRowWz: CONFIG.firstRowAhead,
    prevPassable: allLanes(),   // lanes open in the last spawned row (all, at start)
  });
}


/* ==========================================================================
   3. PROJECTION — one pure mapping shared by rendering and collision
   ========================================================================== */

/** Screen scale at depth z: 1 at the camera plane, → 0 at the horizon. */
function scaleAt(z) {
  return 1 / (1 + CONFIG.perspectiveK * z);
}

/**
 * Map a lane position and depth to screen space.
 * @param {number} laneX  lane-space x: lane index minus centre (-1, 0, 1), or ±1.5 for road edges
 * @param {number} z      depth ahead of the camera plane (>= 0)
 * @returns {{x:number, y:number, s:number}} screen x, ground y, scale
 */
function project(laneX, z) {
  const s = scaleAt(z);
  return {
    x: view.vx + laneX * view.laneW * s,
    y: view.horizonY + (view.h - view.horizonY) * s,
    s,
  };
}

/** Lane index (0..lanes-1) to lane-space x. */
function laneToX(lane) {
  return lane - (CONFIG.lanes - 1) / 2;
}

/** [0, 1, ..., lanes-1] */
function allLanes() {
  return Array.from({ length: CONFIG.lanes }, (_, i) => i);
}


/* ==========================================================================
   4. RENDERING
   ========================================================================== */

/** Resize the canvas to the viewport (DPR-aware) and recompute the layout. */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprMax);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  view.w = w;
  view.h = h;
  view.dpr = dpr;
  view.vx = w / 2;
  view.horizonY = h * CONFIG.horizonRatio;
  const roadHalf = Math.min(w * CONFIG.roadHalfWidthRatio, h * CONFIG.roadHalfWidthMaxRatio);
  view.laneW = (roadHalf * 2) / CONFIG.lanes;
  // Notch / home-bar insets come from CSS env(); read them through a probe element.
  const cs = getComputedStyle(document.getElementById("safe"));
  view.safe = {
    top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0,
    bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0,
  };
}

/** Fill a quad given as [x,y] pairs. */
function fillQuad(a, b, c, d, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(a[0], a[1]);
  ctx.lineTo(b[0], b[1]);
  ctx.lineTo(c[0], c[1]);
  ctx.lineTo(d[0], d[1]);
  ctx.closePath();
  ctx.fill();
}

/** Quad on the ground between lane-space x0..x1 and depth z0..z1. */
function groundQuad(x0, x1, z0, z1, color) {
  const a = project(x0, z0), b = project(x1, z0);
  const c = project(x1, z1), d = project(x0, z1);
  fillQuad([a.x, a.y], [b.x, b.y], [c.x, c.y], [d.x, d.y], color);
}

/** The still part of the sky (gradient, sun, hills, tree line), redrawn only on resize. */
let skyCache = null;

/** Sky, then flat grass below the horizon. */
function drawBackdrop() {
  const C = CONFIG.colors;
  const key = `${view.w}x${view.h}@${view.dpr}`;
  if (!skyCache || skyCache.key !== key) {
    const off = document.createElement("canvas");
    off.width = Math.round(view.w * view.dpr);
    off.height = Math.round((view.horizonY + CONFIG.shakeAmp + 2) * view.dpr);
    const saved = ctx;
    ctx = off.getContext("2d");
    ctx.scale(view.dpr, view.dpr);
    const g = ctx.createLinearGradient(0, 0, 0, view.horizonY);
    g.addColorStop(0, C.skyTop);
    g.addColorStop(1, C.skyBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, view.w, view.horizonY + 1);
    // Unshaken grass under the horizon, so a shaking ground never reveals sky below it.
    ctx.fillStyle = C.grassA;
    ctx.fillRect(0, view.horizonY, view.w, CONFIG.shakeAmp + 2);
    drawSkyStatic();
    ctx = saved;
    skyCache = { key, canvas: off };
  }
  ctx.drawImage(skyCache.canvas, 0, 0, view.w, view.horizonY + CONFIG.shakeAmp + 2);
  drawSkyMoving(performance.now());
}

/** Grass below the horizon, oversized so a screen shake never shows an edge. */
function drawGround() {
  const m = CONFIG.shakeAmp + 2;
  ctx.fillStyle = CONFIG.colors.grassA;
  ctx.fillRect(-m, view.horizonY, view.w + 2 * m, view.h - view.horizonY + m);
}

/** Deterministic 0..1 hash, so scenery is stable without storing it. */
function hash01(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/** Park props beside the path, generated from their slot index (infinite, no state). */
function sceneryItems() {
  const P = CONFIG.sceneryPeriod;
  const first = Math.floor(state.scroll / P) - 1;
  const n = Math.ceil(CONFIG.sceneryDepth / P) + 2;
  const edge = CONFIG.lanes / 2;
  const out = [];
  // [type, cumulative weight, min offset, spread] — offsets in lane widths beyond the path edge
  const TABLE = [
    ["tree", 0.2, 0.7, 2.4], ["pine", 0.3, 0.8, 2.6], ["birch", 0.36, 0.7, 2.2], ["blossom", 0.42, 0.8, 2.2],
    ["bush", 0.55, 0.45, 1.6], ["flowers", 0.65, 0.35, 2.0], ["rock", 0.73, 0.35, 2.2], ["grass", 0.84, 0.25, 2.4],
    ["bench", 0.96, 0.35, 0.15], ["picnic", 1.0, 1.0, 1.0],
  ];
  const push = (type, k, side, h, off, zJitter) => {
    const z = k * P + zJitter - state.scroll;
    if (z <= 0.02 || z > CONFIG.sceneryDepth) return;
    out.push({ type, x: side * (edge + off), z, side, h });
  };
  for (let k = first; k < first + n; k++) {
    for (const side of [-1, 1]) {
      const h = hash01(k * 2 + (side > 0 ? 1 : 0));
      const row = TABLE.find((r) => h < r[1]);
      push(row[0], k, side, h, row[2] + hash01(k * 7.3 + side * 3.1) * row[3], h * P * 0.6);
      // back row of trees, so the park reads as full rather than a single line
      const h2 = hash01(k * 5.1 + side * 9.7);
      if (h2 < CONFIG.farRowChance) {
        const kinds = ["tree", "pine", "tree", "birch", "pine", "blossom"];
        push(kinds[Math.floor(hash01(k * 3.3 + side) * kinds.length)], k, side, h2, 3.2 + hash01(k * 1.9 + side) * 3.2, h2 * P);
      }
      if (k % CONFIG.lampEvery === 0 && (Math.floor(k / CONFIG.lampEvery) % 2 === 0) === (side < 0)) {
        push("lamp", k, side, 0.5, 0.22, 0.05);
      }
    }
  }
  return out;
}

/** Build a Path2D from circles [cx, cy, r] in units of u around (px, py). */
function blobPath(px, py, u, blobs) {
  const path = new Path2D();
  for (const [bx, by, r] of blobs) { path.moveTo(px + (bx + r) * u, py + by * u); path.arc(px + bx * u, py + by * u, r * u, 0, Math.PI * 2); }
  return path;
}

/**
 * Foliage in the reference sheet's manner: thin dark linework, a base tone, a
 * shadow tone on the lower right and a light tone on the upper left, plus a few
 * leaf-cluster strokes for texture.
 */
function drawFoliage(path, cx, cy, size, palette, seed) {
  const C = CONFIG.colors;
  // Outline first at double width, then fill over it: overlapping circles share one outer line.
  ctx.strokeStyle = C.treeOutline;
  ctx.lineWidth = Math.max(2, size * 0.07);
  ctx.lineJoin = "round";
  ctx.stroke(path);
  ctx.save();
  ctx.fillStyle = palette.base;
  ctx.fill(path);
  ctx.clip(path);
  ctx.fillStyle = palette.shade;
  ctx.beginPath(); ctx.ellipse(cx + size * 0.35, cy + size * 0.45, size * 0.95, size * 0.6, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = palette.light;
  ctx.beginPath(); ctx.ellipse(cx - size * 0.35, cy - size * 0.4, size * 0.5, size * 0.32, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = palette.line;
  ctx.lineWidth = Math.max(0.8, size * 0.03);
  ctx.lineCap = "round";
  for (let i = 0; i < 5; i++) {
    const lx = cx + (hash01(seed * 31 + i) - 0.5) * size * 1.2, ly = cy + (hash01(seed * 17 + i) - 0.4) * size * 0.9;
    ctx.beginPath(); ctx.arc(lx, ly, size * 0.13, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  }
  ctx.restore();
}

/*
 * Shaded foliage is too costly to path every frame on a phone, so each tree and
 * bush variant is drawn once into an offscreen canvas at a reference size and
 * then blitted, scaled by depth.
 */
const SCENERY_REF = 100; // css px per size unit in the cache
const SCENERY_RES = 2;   // cache pixels per css px
const sceneryCache = new Map();

/** Get (or build) a cached drawing. draw(px, py, unit) paints with feet at (px, py). */
function cachedScenery(key, wUnits, hUnits, draw) {
  let c = sceneryCache.get(key);
  if (c) return c;
  const off = document.createElement("canvas");
  off.width = Math.ceil(wUnits * SCENERY_REF * SCENERY_RES);
  off.height = Math.ceil(hUnits * SCENERY_REF * SCENERY_RES);
  const saved = ctx;
  ctx = off.getContext("2d");
  ctx.scale(SCENERY_RES, SCENERY_RES);
  const fx = (wUnits * SCENERY_REF) / 2, fy = (hUnits - 0.04) * SCENERY_REF;
  draw(fx, fy, SCENERY_REF);
  ctx = saved;
  c = { canvas: off, fx, fy };
  sceneryCache.set(key, c);
  return c;
}

/** Blit a cached drawing with its feet at (x, y), `unit` css px per size unit. */
function blitScenery(c, x, y, unit) {
  const k = unit / SCENERY_REF;
  ctx.drawImage(c.canvas, x - c.fx * k, y - c.fy * k, (c.canvas.width / SCENERY_RES) * k, (c.canvas.height / SCENERY_RES) * k);
}

function drawTree(x, z, h) {
  const p = project(x, z), u = view.laneW * p.s;
  const v = u * (0.85 + h * 0.4);
  const variant = `tree${h < 0.2 ? "A" : "B"}${Math.floor(h * 4)}`;
  groundShadow(p.x, p.y, v * 0.7, v * 0.15);
  blitScenery(cachedScenery(variant, 2.3, 2.7, (px, py, unit) => paintTree(px, py, unit, h)), p.x, p.y, v);
}

/** Paint one tree, feet at (px, py), v css px per size unit. */
function paintTree(px, py, v, h, paletteOverride) {
  const C = CONFIG.colors;
  const p = { x: px, y: py }, u = v;
  // trunk: tapered, with a shadow side and a fork
  ctx.lineJoin = "round";
  ctx.strokeStyle = C.trunkLine;
  ctx.lineWidth = Math.max(0.8, u * 0.025);
  ctx.fillStyle = C.trunk;
  ctx.beginPath();
  ctx.moveTo(p.x - v * 0.11, p.y);
  ctx.quadraticCurveTo(p.x - v * 0.06, p.y - v * 0.6, p.x - v * 0.07, p.y - v * 1.3);
  ctx.lineTo(p.x + v * 0.07, p.y - v * 1.3);
  ctx.quadraticCurveTo(p.x + v * 0.06, p.y - v * 0.6, p.x + v * 0.11, p.y);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.trunkShade;
  ctx.beginPath();
  ctx.moveTo(p.x + v * 0.02, p.y);
  ctx.quadraticCurveTo(p.x + v * 0.03, p.y - v * 0.6, p.x + v * 0.02, p.y - v * 1.25);
  ctx.lineTo(p.x + v * 0.065, p.y - v * 1.25);
  ctx.quadraticCurveTo(p.x + v * 0.055, p.y - v * 0.6, p.x + v * 0.1, p.y);
  ctx.closePath();
  ctx.fill();
  const blobs = [[0, -1.8, 0.58], [-0.48, -1.42, 0.44], [0.48, -1.42, 0.44], [-0.3, -2.15, 0.4], [0.32, -2.12, 0.42], [0, -1.32, 0.42]];
  const palette = paletteOverride ? paletteOverride : h < 0.2
    ? { base: C.treeA, shade: C.treeShade, light: C.treeLight, line: C.treeLine }
    : { base: C.treeB, shade: C.treeShade, light: C.treeLight, line: C.treeLine };
  drawFoliage(blobPath(p.x, p.y, v, blobs), p.x, p.y - 1.75 * v, v, palette, Math.round(h * 1000));
}

function drawBush(x, z, h) {
  const p = project(x, z), u = view.laneW * p.s * (0.8 + h * 0.4);
  const variant = `bush${h > 0.55 ? "A" : "B"}${Math.floor(h * 4)}`;
  blitScenery(cachedScenery(variant, 1.4, 0.95, (px, py, unit) => paintBush(px, py, unit, h)), p.x, p.y, u);
}

/** Paint one bush, feet at (px, py), u css px per size unit. */
function paintBush(px, py, u, h) {
  const C = CONFIG.colors;
  const p = { x: px, y: py };
  const path = blobPath(p.x, p.y, u, [[-0.32, -0.27, 0.29], [0.32, -0.27, 0.29], [0, -0.45, 0.35], [-0.12, -0.2, 0.25], [0.15, -0.2, 0.25]]);
  drawFoliage(path, p.x, p.y - 0.35 * u, u * 0.55, { base: C.bush, shade: C.treeShade, light: C.treeLight, line: C.treeLine }, Math.round(h * 997));
  ctx.fillStyle = h > 0.55 ? C.flowerA : C.flowerB;
  for (const [fx, fy] of [[-0.3, -0.35], [0.12, -0.6], [0.32, -0.25], [-0.05, -0.32]]) { ctx.beginPath(); ctx.arc(p.x + fx * u, p.y + fy * u, 0.045 * u, 0, Math.PI * 2); ctx.fill(); }
}

/** Grass tufts along both path edges and a few pebbles on the path, scrolling with the ground. */
function drawPathDetails() {
  const C = CONFIG.colors;
  const P = CONFIG.sceneryPeriod * 0.5;
  const first = Math.floor(state.scroll / P);
  const n = Math.ceil(CONFIG.sceneryDepth / P);
  const edge = CONFIG.lanes / 2 + 0.09;
  ctx.lineCap = "round";
  for (let k = first + n; k >= first; k--) {
    const z = k * P - state.scroll;
    if (z <= 0.02) continue;
    const h = hash01(k * 3.7);
    if (k % 2 === 0) for (const side of [-1, 1]) { // edging stones on the path's border
      const ps = project(side * (edge - 0.02), z), us = view.laneW * ps.s;
      const rx = us * (0.07 + h * 0.03), ry = us * 0.035;
      ctx.fillStyle = C.stoneLine;
      ctx.beginPath(); ctx.ellipse(ps.x, ps.y - us * 0.012, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.stone;
      ctx.beginPath(); ctx.ellipse(ps.x, ps.y - us * 0.022, rx * 0.92, ry * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    }
    for (const side of [-1, 1]) {
      const p = project(side * (edge + 0.05 + h * 0.15), z), u = view.laneW * p.s;
      ctx.strokeStyle = C.tuft;
      ctx.lineWidth = Math.max(0.7, u * 0.02);
      ctx.beginPath();
      for (const dx of [-0.06, 0, 0.06]) { ctx.moveTo(p.x + dx * u, p.y); ctx.lineTo(p.x + dx * u * 1.8, p.y - u * (0.1 + Math.abs(dx))); }
      ctx.stroke();
    }
    if (h > 0.55) {
      const lx = (hash01(k * 9.1) - 0.5) * (CONFIG.lanes - 0.3);
      const p = project(lx, z), u = view.laneW * p.s;
      ctx.fillStyle = C.pebble;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, u * 0.045, u * 0.022, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/** Soft ground shadow under a prop. */
function groundShadow(x, y, rx, ry, a = 0.18) {
  ctx.fillStyle = `rgba(50, 60, 20, ${a})`;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}

function drawPine(x, z, h) {
  const p = project(x, z), u = view.laneW * p.s * (0.9 + h * 0.45);
  groundShadow(p.x, p.y, u * 0.55, u * 0.12);
  blitScenery(cachedScenery(`pine${Math.floor(h * 3)}`, 1.6, 3.2, (px, py, v) => paintPine(px, py, v, h)), p.x, p.y, u);
}

/** Conifer: three stacked tiers with a shadow side, on a short trunk. */
function paintPine(px, py, v, h) {
  const C = CONFIG.colors;
  ctx.fillStyle = C.trunk;
  ctx.strokeStyle = C.trunkLine;
  ctx.lineWidth = v * 0.025;
  ctx.fillRect(px - v * 0.07, py - v * 0.5, v * 0.14, v * 0.5);
  ctx.strokeRect(px - v * 0.07, py - v * 0.5, v * 0.14, v * 0.5);
  const tiers = [[0.42, 1.25, 0.62], [0.95, 1.9, 0.5], [1.5, 2.55, 0.36]]; // base y, tip y, half width
  for (const [by, ty, hw] of tiers) {
    const tier = new Path2D();
    tier.moveTo(px - hw * v, py - by * v);
    tier.quadraticCurveTo(px - hw * v * 0.35, py - (by + 0.25) * v, px, py - (ty + 0.05) * v);
    tier.quadraticCurveTo(px + hw * v * 0.35, py - (by + 0.25) * v, px + hw * v, py - by * v);
    tier.quadraticCurveTo(px, py - (by - 0.12) * v, px - hw * v, py - by * v);
    ctx.strokeStyle = C.treeOutline;
    ctx.lineWidth = v * 0.05;
    ctx.lineJoin = "round";
    ctx.stroke(tier);
    ctx.fillStyle = C.pine;
    ctx.fill(tier);
    ctx.save();
    ctx.clip(tier);
    ctx.fillStyle = C.pineShade;
    ctx.fillRect(px + v * 0.02, py - (ty + 0.2) * v, hw * v, (ty - by + 0.4) * v);
    ctx.fillStyle = C.pineLight;
    ctx.beginPath(); ctx.ellipse(px - hw * v * 0.4, py - (by + 0.2) * v, hw * v * 0.25, v * 0.08, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawBirch(x, z, h) {
  const p = project(x, z), u = view.laneW * p.s * (0.85 + h * 0.4);
  groundShadow(p.x, p.y, u * 0.45, u * 0.1);
  blitScenery(cachedScenery(`birch${Math.floor(h * 3)}`, 1.8, 2.8, (px, py, v) => paintBirch(px, py, v, h)), p.x, p.y, u);
}

/** Birch: slim white trunk with dark marks, light airy foliage. */
function paintBirch(px, py, v, h) {
  const C = CONFIG.colors;
  ctx.fillStyle = C.birchBark;
  ctx.strokeStyle = C.trunkLine;
  ctx.lineWidth = v * 0.022;
  ctx.beginPath();
  ctx.moveTo(px - v * 0.07, py);
  ctx.lineTo(px - v * 0.045, py - v * 1.5);
  ctx.lineTo(px + v * 0.045, py - v * 1.5);
  ctx.lineTo(px + v * 0.07, py);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.birchMark;
  for (let i = 0; i < 5; i++) {
    const my = py - v * (0.18 + i * 0.26), side = i % 2 ? 1 : -1;
    ctx.fillRect(px + side * v * 0.01 - (side < 0 ? v * 0.05 : 0), my, v * 0.05, v * 0.025);
  }
  const blobs = [[0, -1.9, 0.45], [-0.36, -1.6, 0.34], [0.36, -1.62, 0.36], [0.05, -2.25, 0.32]];
  drawFoliage(blobPath(px, py, v, blobs), px, py - 1.85 * v, v * 0.8, { base: C.birchLeaf, shade: C.birchShade, light: "#c4ea8e", line: C.treeLine }, Math.round(h * 777));
}

function drawBlossom(x, z, h) {
  const p = project(x, z), u = view.laneW * p.s * (0.85 + h * 0.35);
  groundShadow(p.x, p.y, u * 0.6, u * 0.13);
  blitScenery(cachedScenery(`blossom${Math.floor(h * 3)}`, 2.3, 2.7, (px, py, v) => paintBlossom(px, py, v, h)), p.x, p.y, u);
}

/** Cherry blossom: the round tree shape in pink, dotted with white flowers. */
function paintBlossom(px, py, v, h) {
  const C = CONFIG.colors;
  paintTree(px, py, v, h, { base: C.blossom, shade: C.blossomShade, light: C.blossomLight, line: "rgba(150, 60, 95, 0.45)" });
  ctx.fillStyle = "#ffffff";
  for (let i = 0; i < 14; i++) {
    const fx = (hash01(h * 91 + i) - 0.5) * 1.6, fy = -1.25 - hash01(h * 53 + i) * 1.05;
    ctx.beginPath(); ctx.arc(px + fx * v, py + fy * v, v * 0.035, 0, Math.PI * 2); ctx.fill();
  }
}

function drawRock(x, z, h) {
  const p = project(x, z), u = view.laneW * p.s * (0.5 + h * 0.6);
  groundShadow(p.x, p.y, u * 0.38, u * 0.08);
  blitScenery(cachedScenery(`rock${Math.floor(h * 3)}`, 1, 0.7, (px, py, v) => paintRock(px, py, v, h)), p.x, p.y, u);
}

/** A rounded boulder with a lit top-left and shaded base. */
function paintRock(px, py, v, h) {
  const C = CONFIG.colors;
  const r = new Path2D();
  r.moveTo(px - v * 0.4, py);
  r.quadraticCurveTo(px - v * 0.45, py - v * (0.35 + h * 0.1), px - v * 0.1, py - v * 0.45);
  r.quadraticCurveTo(px + v * 0.25, py - v * 0.5, px + v * 0.38, py - v * 0.18);
  r.quadraticCurveTo(px + v * 0.44, py, px + v * 0.3, py);
  r.closePath();
  ctx.strokeStyle = C.stoneLine;
  ctx.lineWidth = v * 0.05;
  ctx.lineJoin = "round";
  ctx.stroke(r);
  ctx.fillStyle = C.rock;
  ctx.fill(r);
  ctx.save();
  ctx.clip(r);
  ctx.fillStyle = C.rockShade;
  ctx.beginPath(); ctx.ellipse(px + v * 0.18, py, v * 0.4, v * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.rockLight;
  ctx.beginPath(); ctx.ellipse(px - v * 0.15, py - v * 0.33, v * 0.14, v * 0.06, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGrassClump(x, z, h) {
  const p = project(x, z), u = view.laneW * p.s * (0.7 + h * 0.5);
  blitScenery(cachedScenery(`grass${Math.floor(h * 3)}`, 0.8, 0.6, (px, py, v) => paintGrassClump(px, py, v, h)), p.x, p.y, u);
}

/** A clump of tall grass blades. */
function paintGrassClump(px, py, v, h) {
  const C = CONFIG.colors;
  ctx.lineCap = "round";
  for (let i = 0; i < 9; i++) {
    const t = i / 8 - 0.5, len = 0.32 + hash01(h * 40 + i) * 0.2;
    ctx.strokeStyle = i % 3 ? C.grassClump : C.treeShade;
    ctx.lineWidth = v * 0.045;
    ctx.beginPath();
    ctx.moveTo(px + t * v * 0.35, py);
    ctx.quadraticCurveTo(px + t * v * 0.5, py - len * v * 0.6, px + t * v * 0.85, py - len * v);
    ctx.stroke();
  }
}

function drawLamp(x, z) {
  const p = project(x, z), u = view.laneW * p.s;
  groundShadow(p.x, p.y, u * 0.2, u * 0.05);
  blitScenery(cachedScenery("lamp", 0.6, 2.4, (px, py, v) => paintLamp(px, py, v)), p.x, p.y, u);
}

/** Park lamp: iron post, curled bracket, glowing lantern. */
function paintLamp(px, py, v) {
  const C = CONFIG.colors;
  ctx.fillStyle = C.lampPole;
  ctx.fillRect(px - v * 0.06, py - v * 0.12, v * 0.12, v * 0.12);
  ctx.fillRect(px - v * 0.03, py - v * 1.95, v * 0.06, v * 1.85);
  const glow = ctx.createRadialGradient(px, py - v * 2.08, v * 0.02, px, py - v * 2.08, v * 0.28);
  glow.addColorStop(0, "rgba(255, 236, 170, 0.55)");
  glow.addColorStop(1, "rgba(255, 236, 170, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(px, py - v * 2.08, v * 0.28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.lampGlass;
  ctx.strokeStyle = C.lampPole;
  ctx.lineWidth = v * 0.03;
  ctx.beginPath();
  ctx.moveTo(px - v * 0.1, py - v * 1.95);
  ctx.lineTo(px - v * 0.13, py - v * 2.2);
  ctx.lineTo(px + v * 0.13, py - v * 2.2);
  ctx.lineTo(px + v * 0.1, py - v * 1.95);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.lampPole;
  ctx.beginPath();
  ctx.moveTo(px - v * 0.17, py - v * 2.2);
  ctx.lineTo(px, py - v * 2.32);
  ctx.lineTo(px + v * 0.17, py - v * 2.2);
  ctx.closePath();
  ctx.fill();
}

/** Picnic blanket lying on the grass in perspective, with a basket. */
function drawPicnic(x, z, h) {
  const C = CONFIG.colors;
  const w = 0.75, d = 0.5, cells = 4;
  for (let i = 0; i < cells; i++) {
    for (let j = 0; j < cells; j++) {
      const x0 = x - w / 2 + (w * i) / cells, z0 = z - d / 2 + (d * j) / cells;
      const a = project(x0, z0), b = project(x0 + w / cells, z0), c = project(x0 + w / cells, z0 + d / cells), e = project(x0, z0 + d / cells);
      fillQuad([a.x, a.y], [b.x, b.y], [c.x, c.y], [e.x, e.y], (i + j) % 2 ? C.blanketA : C.blanketB);
    }
  }
  const p = project(x + (h > 0.96 ? 0.12 : -0.1), z), u = view.laneW * p.s;
  ctx.fillStyle = C.basket;
  ctx.strokeStyle = C.trunkLine;
  ctx.lineWidth = Math.max(0.8, u * 0.015);
  roundRectPath(p.x - u * 0.09, p.y - u * 0.11, u * 0.18, u * 0.11, u * 0.02);
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(p.x, p.y - u * 0.11, u * 0.07, Math.PI, 0); ctx.stroke();
}

function drawBench(x, z, side) {
  const C = CONFIG.colors;
  const p = project(x, z), u = view.laneW * p.s;
  const w = 0.95 * u;
  ctx.lineWidth = Math.max(1, u * 0.03);
  ctx.strokeStyle = C.obstacleOutline;
  ctx.fillStyle = C.benchLeg;
  for (const lx of [-0.38, 0.38]) { ctx.fillRect(p.x + lx * u - u * 0.03, p.y - u * 0.4, u * 0.06, u * 0.4); }
  ctx.fillStyle = C.bench;
  roundRectPath(p.x - w / 2, p.y - u * 0.46, w, u * 0.1, u * 0.03); ctx.fill(); ctx.stroke();
  const bx = p.x + side * u * 0.06;
  roundRectPath(bx - w / 2, p.y - u * 0.78, w, u * 0.09, u * 0.03); ctx.fill(); ctx.stroke();
  roundRectPath(bx - w / 2, p.y - u * 0.64, w, u * 0.09, u * 0.03); ctx.fill(); ctx.stroke();
}

function drawFlowers(x, z, h) {
  const C = CONFIG.colors;
  const p = project(x, z), u = view.laneW * p.s;
  const cols = [C.flowerA, C.flowerB, C.flowerC];
  for (let i = 0; i < 6; i++) {
    const fx = (hash01(h * 50 + i) - 0.5) * 0.8, fy = -hash01(h * 70 + i) * 0.12;
    ctx.fillStyle = cols[i % 3];
    ctx.beginPath(); ctx.arc(p.x + fx * u, p.y + fy * u - 0.05 * u, 0.06 * u, 0, Math.PI * 2); ctx.fill();
  }
}

const SCENERY_DRAW = {
  pine: (it) => drawPine(it.x, it.z, it.h),
  birch: (it) => drawBirch(it.x, it.z, it.h),
  blossom: (it) => drawBlossom(it.x, it.z, it.h),
  rock: (it) => drawRock(it.x, it.z, it.h),
  grass: (it) => drawGrassClump(it.x, it.z, it.h),
  lamp: (it) => drawLamp(it.x, it.z),
  picnic: (it) => drawPicnic(it.x, it.z, it.h),
  tree: (it) => drawTree(it.x, it.z, it.h),
  bush: (it) => drawBush(it.x, it.z, it.h),
  bench: (it) => drawBench(it.x, it.z, it.side),
  flowers: (it) => drawFlowers(it.x, it.z, it.h),
};

/** Sun, hills and the distant tree line (cached by drawBackdrop). */
function drawSkyStatic() {
  const C = CONFIG.colors;
  const sx = view.w * 0.84, sy = view.horizonY * 0.7, sr = Math.min(view.w, view.h) * 0.07;
  const glow = ctx.createRadialGradient(sx, sy, sr * 0.6, sx, sy, sr * 2.6);
  glow.addColorStop(0, "rgba(255, 244, 190, 0.7)");
  glow.addColorStop(1, "rgba(255, 244, 190, 0)");
  ctx.fillStyle = glow;
  ctx.fillRect(sx - sr * 3, sy - sr * 3, sr * 6, sr * 6);
  ctx.fillStyle = C.sun;
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  drawHillsAndTreeLine();
}

/** Drifting clouds and gliding birds. */
function drawSkyMoving(now) {
  const C = CONFIG.colors;
  const cu = Math.min(view.w, view.h) * 0.05;
  for (let i = 0; i < 3; i++) {
    const span = view.w + cu * 8;
    const cx = ((hash01(i + 9) * span + now * 0.006 * (1 + i * 0.3)) % span) - cu * 4;
    const cy = view.horizonY * (0.18 + 0.22 * i);
    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.beginPath();
    for (const [bx, by, r] of [[-1.3, 0.2, 0.9], [0, -0.2, 1.25], [1.3, 0.2, 0.9], [0.4, 0.35, 0.8]]) { ctx.moveTo(cx + (bx + r) * cu, cy + by * cu); ctx.arc(cx + bx * cu, cy + by * cu, r * cu, 0, Math.PI * 2); }
    ctx.fill();
  }
  drawBirds(now);
}

function drawHillsAndTreeLine() {
  const C = CONFIG.colors;
  // rolling hills, far then near
  for (const [color, amp, f, ph] of [[C.hillFar, 0.05, 0.0045, 1.3], [C.hillNear, 0.032, 0.0075, 4.1]]) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, view.horizonY + 2);
    for (let x = 0; x <= view.w + 8; x += 8) {
      const y = view.horizonY - view.h * amp * (0.55 + 0.3 * Math.sin(x * f + ph) + 0.15 * Math.sin(x * f * 2.7 + ph * 2));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(view.w + 8, view.horizonY + 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = C.farTrees;
  ctx.beginPath();
  const r0 = Math.max(8, view.h * 0.022);
  for (let x = -r0; x < view.w + r0; x += r0 * 1.3) {
    const r = r0 * (0.7 + hash01(Math.round(x / r0)) * 0.6);
    ctx.moveTo(x + r, view.horizonY);
    ctx.arc(x, view.horizonY, r, Math.PI, 0);
  }
  ctx.fill();
}

/** Three birds gliding across the sky. */
function drawBirds(now) {
  const C = CONFIG.colors;
  // birds gliding across, wings flapping
  ctx.strokeStyle = C.bird;
  ctx.lineCap = "round";
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 3; i++) {
    const span = view.w + 120;
    const bx = ((hash01(i + 31) * span + now * 0.022 * (1 + i * 0.25)) % span) - 60;
    const by = view.horizonY * (0.22 + 0.16 * i) + Math.sin(now * 0.0011 + i * 2) * 10;
    const wing = Math.sin(now * 0.012 + i * 2.1) * 4;
    const sz = 6 + i * 1.5;
    ctx.beginPath();
    ctx.moveTo(bx - sz, by - wing);
    ctx.quadraticCurveTo(bx - sz * 0.4, by - wing * 0.2 - 2, bx, by);
    ctx.quadraticCurveTo(bx + sz * 0.4, by - wing * 0.2 - 2, bx + sz, by - wing);
    ctx.stroke();
  }
}

/** Alternating grass stripes that scroll toward the camera. */
function drawGrassBands() {
  const P = CONFIG.grassBandPeriod;
  const offset = state.scroll % P;
  const first = Math.floor(state.scroll / P);
  const count = Math.ceil(CONFIG.viewDepth / P) + 1;
  for (let k = count; k >= 0; k--) {
    const z0 = Math.max(k * P - offset, 0);
    const z1 = k * P - offset + P;
    if (z1 <= 0) continue;
    if ((first + k) % 2 !== 0) continue;
    const a = project(0, z0), b = project(0, z1);
    ctx.fillStyle = CONFIG.colors.grassB;
    ctx.fillRect(-CONFIG.shakeAmp - 2, b.y, view.w + 2 * CONFIG.shakeAmp + 4, a.y - b.y + 1);
  }
}

/** The path: edges, surface, and scrolling dashed lane dividers. */
function drawRoad() {
  const C = CONFIG.colors;
  const half = CONFIG.lanes / 2;
  const z0 = 0, z1 = CONFIG.viewDepth;
  groundQuad(-half - 0.09, half + 0.09, z0, z1, C.roadEdge);
  groundQuad(-half, half, z0, z1, C.road);
  for (let lane = 0; lane < CONFIG.lanes; lane++) { // lighter worn track down each lane
    const x = laneToX(lane);
    groundQuad(x - 0.24, x + 0.24, z0, z1, C.roadWear);
  }

  const P = CONFIG.dashPeriod;
  const offset = state.scroll % P;
  const count = Math.ceil(CONFIG.viewDepth / P) + 1;
  for (let lane = 1; lane < CONFIG.lanes; lane++) {
    const x = lane - half;
    for (let k = count; k >= 0; k--) {
      const d0 = k * P - offset;
      const d1 = d0 + CONFIG.dashLength;
      if (d1 <= 0 || d0 >= CONFIG.viewDepth) continue;
      groundQuad(x - 0.03, x + 0.03, Math.max(d0, 0), d1, C.marking);
    }
  }
}

/*
 * Caius is a puppet rig cut from the reference art (assets/art/reference/dog_2.jpg)
 * by tools/art/build_caius_sprites.py: the rear running pose in 8 pieces (four legs,
 * tail, head, tongue, body) and the front sitting pose in 3 (body, head, tongue).
 * Each piece turns around its joint, so the design stays the reference's own while
 * the motion is continuous: a trot cycle for the legs, springs for the tail, head
 * and tongue, and blended poses for jumping, landing, leaning and crashing.
 */
const SPRITES = {}; // whole pictures (the treat)
const RIGS = {};    // puppet rigs
for (const [name, d] of Object.entries(SPRITE_DATA)) {
  if (d.pieces) {
    const pieces = {};
    for (const [pn, pd] of Object.entries(d.pieces)) {
      const img = new Image();
      img.src = pd.src;
      pieces[pn] = { ...pd, img };
    }
    RIGS[name] = { ...d, pieces };
  } else {
    const img = new Image();
    img.src = d.src;
    SPRITES[name] = { ...d, img };
  }
}

/** Spring-animated values for the rig: [value, velocity] pairs plus blend weights. */
const rigAnim = {};
function resetRigAnim() {
  Object.assign(rigAnim, {
    tail: [0, 0], headY: [0, 0], headA: [0, 0], tongue: [0, 0],
    tuck: [0, 0], stretch: [1, 0], gait: [1, 0], flinch: [0, 0],
    prevJumpY: 0, time: 0,
  });
}
resetRigAnim();

/** Damped spring step (semi-implicit Euler); s = [value, velocity]. */
function springTo(s, target, stiffness, damping, dt) {
  s[1] += (stiffness * (target - s[0]) - damping * s[1]) * dt;
  s[0] += s[1] * dt;
  return s[0];
}

/** Advance the rig's secondary motion. Runs every frame, after the simulation. */
function updateRig(dt) {
  const R = CONFIG.rig;
  rigAnim.time += dt;
  if (dt <= 0) return;
  const ph = state.runPhase;
  const vy = (state.jumpY - rigAnim.prevJumpY) / dt; // lane widths per second, + = rising
  rigAnim.prevJumpY = state.jumpY;
  const airborne = !state.grounded;
  const running = ui.screen === "playing" && state.running;
  springTo(rigAnim.gait, running && !airborne ? 1 : 0, 120, 18, dt);
  springTo(rigAnim.tuck, airborne ? 1 : 0, airborne ? 260 : 380, airborne ? 22 : 26, dt);
  springTo(rigAnim.stretch, airborne ? (vy > 0 ? 1.05 : 0.97) : 1, 200, 20, dt);
  springTo(rigAnim.flinch, 0, 90, 9, dt);
  // tail: wag with the stride, swing away from the turn, stream up when rising, droop after a crash
  const tailTarget = state.crashed ? R.tailDroop
    : airborne ? (vy > 0 ? -R.tailJumpLift : R.tailJumpLift * 0.4)
    : Math.sin(ph * 0.5 + 1) * R.tailWag - state.tilt * 1.6;
  springTo(rigAnim.tail, tailTarget, R.tailStiffness, R.tailDamping, dt);
  // head: bobs a beat behind the body, looks into a turn, nods back after a crash
  const headYTarget = running ? -Math.abs(Math.sin(ph - 0.6)) * R.headBob : 0;
  springTo(rigAnim.headY, headYTarget + (state.crashed ? 6 : 0), 160, 14, dt);
  springTo(rigAnim.headA, -state.tilt * 0.8 + (airborne ? (vy > 0 ? -0.07 : 0.04) : Math.sin(ph) * 0.02), 140, 13, dt);
  // tongue: flaps with each step and lags behind the jump
  const tongueTarget = airborne ? (vy > 0 ? 0.35 : -0.25) : running ? Math.sin(ph * 2 - 1.2) * R.tongueFlap : 0;
  springTo(rigAnim.tongue, tongueTarget, 220, 10, dt);
}

/** Crash: jolt the head and body back. */
function onCrashRig() {
  rigAnim.flinch[1] -= 2.2;
  rigAnim.headA[1] += 4;
}

/** Piece transforms (sprite pixels / radians) for the running rig in its current state. */
function runRigPose() {
  const R = CONFIG.rig;
  const ph = state.runPhase;
  const g = rigAnim.gait[0], t = rigAnim.tuck[0];
  const A = Math.sin(ph), Bp = Math.sin(ph + Math.PI); // diagonal pairs: FL+HR, FR+HL
  const lift = R.legLift;
  return {
    // planted in the reference pose: lifts and swings back
    legHR: { dy: -Math.max(0, A) * lift * g - 18 * t, a: -A * R.legSwing * g - 0.06 * t, sy: 1 - Math.max(0, A) * 0.08 * g - 0.1 * t },
    legFR: { dy: -Math.max(0, Bp) * lift * 0.55 * g - 12 * t, a: -Bp * R.legSwing * 0.7 * g + 0.12 * t },
    // lifted in the reference pose: reaches down to the ground
    legHL: { dy: Math.max(0, -Bp) * lift * 0.8 * g - 12 * t, a: Bp * R.legSwing * g + 0.08 * t, sy: 1 + Math.max(0, -Bp) * 0.06 * g - 0.08 * t },
    legFL: { dy: Math.max(0, -A) * lift * 0.5 * g - 10 * t, a: A * R.legSwing * 0.7 * g - 0.14 * t },
    tail: { a: rigAnim.tail[0] },
    head: { dy: rigAnim.headY[0], a: rigAnim.headA[0] + rigAnim.flinch[0] * 0.3 },
    tongue: { a: rigAnim.tongue[0] },
  };
}

/** Piece transforms for the sitting rig on the Title: breathing, a slow head tilt, panting. */
function sitRigPose() {
  const t = rigAnim.time;
  const breath = Math.sin(t * 2.4);
  return {
    body: { sy: 1 + breath * 0.012 },
    head: { dy: breath * 1.5, a: Math.sin(t * 0.8) * 0.035 },
    tongue: { sy: 1 + Math.sin(t * 8) * 0.08, a: Math.sin(t * 8) * 0.03 },
  };
}

/** Eyes closed for a moment every few seconds (Title pose). Drawn in sit-sprite pixels. */
function drawBlink() {
  const t = rigAnim.time % CONFIG.rig.blinkEvery;
  if (t > 0.13) return;
  for (const [ex, ey] of [[63, 34], [107, 34]]) {
    ctx.fillStyle = "#b65a29";
    ctx.beginPath(); ctx.ellipse(ex, ey, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#4a1d0c"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(ex - 8, ey + 1); ctx.quadraticCurveTo(ex, ey + 5, ex + 8, ey + 1); ctx.stroke();
  }
}

/**
 * Draw a rig with its feet at (x, groundY - air).
 * @param {object} rig RIGS entry
 * @param {number} k css px per sprite pixel
 * @param {{air:number, bob:number, tilt:number, sx:number, sy:number, parts:object, after?:object}} pose
 */
function drawRig(rig, x, groundY, k, pose) {
  for (const pc of Object.values(rig.pieces)) if (!pc.img.complete || !pc.img.naturalWidth) return; // still decoding
  // ground shadow (stays on the ground while airborne)
  const B = rig.h * k;
  const shrink = 1 / (1 + pose.air / (B * 0.9));
  ctx.fillStyle = "rgba(60,40,10,0.22)";
  ctx.beginPath();
  ctx.ellipse(x, groundY, B * 0.33 * shrink, B * 0.07 * shrink, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.translate(x, groundY - pose.air + pose.bob);
  ctx.rotate(pose.tilt);
  ctx.scale(k * pose.sx, k * pose.sy);
  ctx.translate(-rig.ax, -rig.ay);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  for (const name of rig.order) {
    const pc = rig.pieces[name], t = pose.parts[name] || {};
    ctx.save();
    ctx.translate(pc.px + (t.dx || 0), pc.py + (t.dy || 0));
    ctx.rotate(t.a || 0);
    ctx.scale(t.sx || 1, t.sy || 1);
    ctx.translate(-pc.px, -pc.py);
    ctx.drawImage(pc.img, pc.x, pc.y);
    if (pose.after && pose.after[name]) pose.after[name]();
    ctx.restore();
  }
  ctx.restore();
}

/** The player: picks the rig and pose from the game state and draws Caius at the lane position. */
function drawPlayer() {
  const p = project(laneToX(state.laneVis), CONFIG.dogZ);
  const u = view.laneW * p.s;
  const run = RIGS.rig_run;
  const k = (CONFIG.dogHeight * u) / run.h; // css px per sprite pixel, same for both rigs
  if (ui.screen === "title") {
    drawRig(RIGS.rig_sit, p.x, p.y, k * CONFIG.titleDogScale, {
      air: 0, bob: 0, tilt: 0, sx: 1, sy: 1, parts: sitRigPose(), after: { head: drawBlink },
    });
    return;
  }
  const gait = rigAnim.gait[0];
  const bob = -Math.abs(Math.sin(state.runPhase)) * CONFIG.rig.bodyBob * gait * k;
  const roll = Math.sin(state.runPhase) * CONFIG.rig.bodyRoll * gait;
  const stretch = rigAnim.stretch[0];
  drawRig(run, p.x, p.y, k, {
    air: state.jumpY * u,
    bob,
    tilt: state.tilt + roll + rigAnim.flinch[0] * 0.08,
    sx: (state.squashX || 1) / Math.sqrt(stretch),
    sy: (state.squashY || 1) * stretch,
    parts: runRigPose(),
  });
}

/** Rounded-rect path helper (fill/stroke by caller). */
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
}

/** Screen corners of an upright box face at depth z: [bottom-left, bottom-right, top-right, top-left]. */
function boxFace(lx, w, h, z) {
  const p = project(lx, z), u = view.laneW * p.s;
  return { x0: p.x - (w / 2) * u, x1: p.x + (w / 2) * u, y0: p.y, y1: p.y - h * u, u };
}

/**
 * Wooden crate centred on depth z. The side facing the camera axis shows when the
 * crate is in an outer lane; the top recedes toward the horizon.
 */
function drawCrate(lane, z) {
  const C = CONFIG.colors, T = CONFIG.obstacleTypes.crate;
  const lx = laneToX(lane);
  const nf = boxFace(lx, T.w, T.h, Math.max(0.001, z - T.d / 2)), ff = boxFace(lx, T.w, T.h, z + T.d / 2);
  const u = nf.u, lw = Math.max(1, u * 0.02);
  groundShadow((nf.x0 + nf.x1) / 2 + (lx < 0 ? u * 0.08 : lx > 0 ? -u * 0.08 : 0), nf.y0, (nf.x1 - nf.x0) * 0.62, u * 0.07, 0.22);
  ctx.lineJoin = "round";
  ctx.lineWidth = lw;
  ctx.strokeStyle = C.obstacleOutline;
  // visible side face
  if (lx + T.w / 2 < 0) { fillQuad([nf.x1, nf.y0], [ff.x1, ff.y0], [ff.x1, ff.y1], [nf.x1, nf.y1], C.crateSide); ctx.stroke(); }
  if (lx - T.w / 2 > 0) { fillQuad([nf.x0, nf.y0], [ff.x0, ff.y0], [ff.x0, ff.y1], [nf.x0, nf.y1], C.crateSide); ctx.stroke(); }
  // top
  fillQuad([nf.x0, nf.y1], [nf.x1, nf.y1], [ff.x1, ff.y1], [ff.x0, ff.y1], C.crateTop);
  ctx.stroke();
  ctx.strokeStyle = C.crateDark;
  ctx.lineWidth = Math.max(0.7, u * 0.012);
  for (const t of [0.33, 0.66]) {
    ctx.beginPath();
    ctx.moveTo(nf.x0 + (nf.x1 - nf.x0) * t, nf.y1);
    ctx.lineTo(ff.x0 + (ff.x1 - ff.x0) * t, ff.y1);
    ctx.stroke();
  }
  // front: frame boards around a planked panel, diagonal brace, nails
  const fw = nf.x1 - nf.x0, fh = nf.y0 - nf.y1, b = fw * 0.13;
  ctx.fillStyle = C.crateFrame;
  roundRectPath(nf.x0, nf.y1, fw, fh, u * 0.03);
  ctx.fill();
  ctx.fillStyle = C.crate;
  ctx.fillRect(nf.x0 + b, nf.y1 + b, fw - 2 * b, fh - 2 * b);
  ctx.strokeStyle = C.crateDark;
  ctx.lineWidth = Math.max(0.7, u * 0.012);
  for (let i = 1; i < 4; i++) {
    const y = nf.y1 + b + ((fh - 2 * b) * i) / 4;
    ctx.beginPath(); ctx.moveTo(nf.x0 + b, y); ctx.lineTo(nf.x1 - b, y); ctx.stroke();
  }
  ctx.fillStyle = C.crateFrame;
  ctx.save();
  ctx.translate(nf.x0 + fw / 2, nf.y1 + fh / 2);
  ctx.rotate(-Math.atan2(fh - 2 * b, fw - 2 * b));
  ctx.fillRect(-Math.hypot(fw, fh) / 2 + b, -b * 0.45, Math.hypot(fw, fh) - 2 * b, b * 0.9);
  ctx.restore();
  ctx.fillStyle = C.nail;
  for (const [nx, ny] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
    ctx.beginPath(); ctx.arc(nf.x0 + b / 2 + nx * (fw - b), nf.y1 + b / 2 + ny * (fh - b), Math.max(0.8, u * 0.018), 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = C.obstacleOutline;
  ctx.lineWidth = lw;
  roundRectPath(nf.x0, nf.y1, fw, fh, u * 0.03);
  ctx.stroke();
}

/** Round hay bale lying end-on: tall, so it has to be dodged. */
function drawHay(lane, z) {
  const C = CONFIG.colors, T = CONFIG.obstacleTypes.hay;
  const lx = laneToX(lane);
  const n = project(lx, Math.max(0.001, z - T.d / 2)), f = project(lx, z + T.d / 2);
  const un = view.laneW * n.s, uf = view.laneW * f.s;
  const rn = (T.h / 2) * un, rf = (T.h / 2) * uf;
  groundShadow(n.x, n.y, rn * 1.15, un * 0.07, 0.22);
  ctx.lineWidth = Math.max(1, un * 0.02);
  ctx.strokeStyle = C.hayLine;
  // body between the back and front discs
  ctx.fillStyle = C.hayDark;
  ctx.beginPath();
  ctx.moveTo(n.x - rn, n.y - rn);
  ctx.lineTo(f.x - rf, f.y - rf);
  ctx.arc(f.x, f.y - rf, rf, Math.PI, 0);
  ctx.lineTo(n.x + rn, n.y - rn);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // front disc with a spiral of straw
  ctx.fillStyle = C.hay;
  ctx.beginPath(); ctx.arc(n.x, n.y - rn, rn, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.lineWidth = Math.max(0.7, un * 0.013);
  ctx.beginPath();
  for (let a = 0; a < Math.PI * 7; a += 0.2) {
    const r = rn * (a / (Math.PI * 7)) * 0.9;
    const px = n.x + Math.cos(a) * r, py = n.y - rn + Math.sin(a) * r;
    if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  // twine band
  ctx.strokeStyle = C.hurdleRed;
  ctx.lineWidth = Math.max(1, un * 0.025);
  ctx.beginPath(); ctx.moveTo(n.x - rn * 0.98, n.y - rn * 1.2); ctx.lineTo(f.x - rf * 0.98, f.y - rf * 1.2); ctx.stroke();
}

/** Low log lying across the lane: bark, moss, and a ringed end facing the camera axis. */
function drawLog(lane, z) {
  const C = CONFIG.colors, T = CONFIG.obstacleTypes.log;
  const lx = laneToX(lane);
  const p = project(lx, z);
  const u = view.laneW * p.s;
  const w = T.w * u, h = T.h * u;
  groundShadow(p.x, p.y, w * 0.55, u * 0.05, 0.22);
  ctx.lineWidth = Math.max(1, u * 0.02);
  ctx.strokeStyle = C.obstacleOutline;
  roundRectPath(p.x - w / 2, p.y - h, w, h, h / 2);
  ctx.fillStyle = C.log;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = C.logTop; // light along the top
  ctx.fillRect(p.x - w / 2, p.y - h, w, h * 0.35);
  ctx.strokeStyle = C.logRing;
  ctx.lineWidth = Math.max(0.7, u * 0.013);
  for (let i = 0; i < 6; i++) {
    const bx = p.x - w * 0.42 + i * w * 0.16, by = p.y - h * (0.3 + (i % 3) * 0.18);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + w * 0.09, by + h * 0.04); ctx.stroke();
  }
  ctx.fillStyle = C.moss;
  ctx.beginPath(); ctx.ellipse(p.x - w * 0.12, p.y - h * 0.95, w * 0.14, h * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = C.obstacleOutline;
  ctx.lineWidth = Math.max(1, u * 0.02);
  roundRectPath(p.x - w / 2, p.y - h, w, h, h / 2);
  ctx.stroke();
  // cut end on the side facing the camera axis
  const endX = lx > 0 ? p.x - w / 2 + h * 0.45 : p.x + w / 2 - h * 0.45;
  ctx.fillStyle = C.logEnd;
  ctx.beginPath(); ctx.ellipse(endX, p.y - h / 2, h * 0.36, h * 0.47, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.logRing;
  for (const r of [0.28, 0.14]) { ctx.beginPath(); ctx.ellipse(endX, p.y - h / 2, h * r, h * r * 1.3, 0, 0, Math.PI * 2); ctx.stroke(); }
}

/** Traffic cone: lit left half, shaded right half, reflective bands, weighted base. */
function drawCone(lane, z) {
  const C = CONFIG.colors, T = CONFIG.obstacleTypes.cone;
  const p = project(laneToX(lane), z);
  const u = view.laneW * p.s;
  const w = T.w * u, h = T.h * u;
  groundShadow(p.x, p.y, w * 0.75, u * 0.04, 0.22);
  ctx.lineWidth = Math.max(1, u * 0.02);
  ctx.lineJoin = "round";
  ctx.strokeStyle = C.obstacleOutline;
  roundRectPath(p.x - w * 0.62, p.y - h * 0.12, w * 1.24, h * 0.14, h * 0.05);
  ctx.fillStyle = C.coneBase;
  ctx.fill(); ctx.stroke();
  const body = new Path2D();
  body.moveTo(p.x - w / 2, p.y - h * 0.1);
  body.lineTo(p.x - w * 0.08, p.y - h);
  body.quadraticCurveTo(p.x, p.y - h * 1.04, p.x + w * 0.08, p.y - h);
  body.lineTo(p.x + w / 2, p.y - h * 0.1);
  body.closePath();
  ctx.fillStyle = C.cone;
  ctx.fill(body);
  ctx.save();
  ctx.clip(body);
  ctx.fillStyle = C.coneDark;
  ctx.fillRect(p.x + w * 0.05, p.y - h * 1.1, w, h * 1.1);
  ctx.fillStyle = C.coneLight;
  ctx.fillRect(p.x - w * 0.3, p.y - h * 1.1, w * 0.12, h * 1.1);
  ctx.fillStyle = C.coneStripe;
  ctx.fillRect(p.x - w, p.y - h * 0.62, w * 2, h * 0.16);
  ctx.fillRect(p.x - w, p.y - h * 0.36, w * 2, h * 0.12);
  ctx.restore();
  ctx.stroke(body);
}

/** Low hurdle: two posts and a red-and-white striped bar. */
function drawHurdle(lane, z) {
  const C = CONFIG.colors, T = CONFIG.obstacleTypes.hurdle;
  const p = project(laneToX(lane), z);
  const u = view.laneW * p.s;
  const w = T.w * u, h = T.h * u, bar = h * 0.26;
  groundShadow(p.x, p.y, w * 0.55, u * 0.035, 0.2);
  ctx.lineWidth = Math.max(1, u * 0.018);
  ctx.strokeStyle = C.obstacleOutline;
  for (const sx of [-1, 1]) { // posts and feet
    ctx.fillStyle = C.hurdlePost;
    ctx.fillRect(p.x + sx * w * 0.42 - u * 0.025, p.y - h, u * 0.05, h);
    ctx.strokeRect(p.x + sx * w * 0.42 - u * 0.025, p.y - h, u * 0.05, h);
    ctx.fillRect(p.x + sx * w * 0.42 - u * 0.07, p.y - u * 0.025, u * 0.14, u * 0.025);
  }
  roundRectPath(p.x - w / 2, p.y - h, w, bar, bar * 0.3);
  ctx.fillStyle = C.hurdleWhite;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = C.hurdleRed;
  for (let i = -1; i < 7; i += 2) {
    ctx.beginPath();
    ctx.moveTo(p.x - w / 2 + (i * w) / 6, p.y - h + bar);
    ctx.lineTo(p.x - w / 2 + ((i + 1) * w) / 6, p.y - h);
    ctx.lineTo(p.x - w / 2 + ((i + 2) * w) / 6, p.y - h);
    ctx.lineTo(p.x - w / 2 + ((i + 1) * w) / 6, p.y - h + bar);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  roundRectPath(p.x - w / 2, p.y - h, w, bar, bar * 0.3);
  ctx.stroke();
}

const OBSTACLE_DRAW = { crate: drawCrate, log: drawLog, cone: drawCone, hay: drawHay, hurdle: drawHurdle };

/** A floating, gently bobbing bone treat (flat, thin brown linework like the reference art). */
function drawBone(lane, z, seed) {
  const C = CONFIG.colors;
  const p = project(laneToX(lane), z);
  const u = view.laneW * p.s;
  const w = CONFIG.treatWidth * u;
  const bob = Math.sin(state.runPhase * 0.5 + seed * 3) * 0.04 * u;
  const cy = p.y - CONFIG.treatFloat * u - w * 0.25 + bob;
  const r = w * 0.17;
  ctx.fillStyle = "rgba(60,40,10,0.14)";
  ctx.beginPath(); ctx.ellipse(p.x, p.y, w * 0.38, w * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(p.x, cy);
  ctx.rotate(Math.sin(state.runPhase * 0.4 + seed * 2) * 0.15);
  const bone = new Path2D();
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    bone.moveTo(sx * (w / 2 - r) + r, sy * r * 0.8);
    bone.arc(sx * (w / 2 - r), sy * r * 0.8, r, 0, Math.PI * 2);
  }
  bone.rect(-w / 2 + r, -r * 0.7, w - 2 * r, r * 1.4);
  ctx.lineJoin = "round";
  ctx.strokeStyle = C.boneOutline;
  ctx.lineWidth = Math.max(1.6, u * 0.04);
  ctx.stroke(bone); // outline first, then fill over it: one clean outer line
  ctx.fillStyle = C.bone;
  ctx.fill(bone);
  ctx.fillStyle = C.boneShade;
  ctx.fillRect(-w / 2 + r * 1.2, r * 0.1, w - 2.4 * r, r * 0.45);
  ctx.restore();
}

/** Gingu the banana penguin: big, hovering, wobbling, with a golden glow and orbiting sparkles. */
function drawPenguin(lane, z, seed) {
  const sp = SPRITES.banana_penguin;
  if (!sp || !sp.img.complete || !sp.img.naturalWidth) return; // still decoding
  const C = CONFIG.colors, P = CONFIG.penguin;
  const p = project(laneToX(lane), z);
  const u = view.laneW * p.s;
  const h = P.height * u;
  const k = h / sp.h;
  const t = rigAnim.time;
  const bob = Math.sin(t * 3 + seed) * 0.05 * u;
  const cy = p.y - P.float * u - h / 2 + bob;
  ctx.fillStyle = "rgba(60,40,10,0.18)";
  ctx.beginPath(); ctx.ellipse(p.x, p.y, sp.w * k * 0.5, u * 0.045, 0, 0, Math.PI * 2); ctx.fill();
  const glow = ctx.createRadialGradient(p.x, cy, h * 0.1, p.x, cy, h * 0.75);
  glow.addColorStop(0, C.penguinGlow);
  glow.addColorStop(1, "rgba(255, 226, 110, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(p.x, cy, h * 0.75, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffffff";
  for (let i = 0; i < 5; i++) { // sparkles orbiting
    const a = t * 1.8 + (i * Math.PI * 2) / 5, r = h * 0.55;
    const sx = p.x + Math.cos(a) * r * 0.75, sy = cy + Math.sin(a) * r * 0.55, ss = u * (0.03 + 0.015 * Math.sin(t * 6 + i));
    ctx.beginPath();
    ctx.moveTo(sx, sy - ss * 2); ctx.lineTo(sx + ss * 0.5, sy); ctx.lineTo(sx, sy + ss * 2); ctx.lineTo(sx - ss * 0.5, sy); ctx.closePath();
    ctx.moveTo(sx - ss * 2, sy); ctx.lineTo(sx, sy + ss * 0.5); ctx.lineTo(sx + ss * 2, sy); ctx.lineTo(sx, sy - ss * 0.5); ctx.closePath();
    ctx.fill();
  }
  ctx.save();
  ctx.translate(p.x, p.y - P.float * u + bob);
  ctx.rotate(Math.sin(t * 2.2 + seed * 5) * 0.1);
  ctx.scale(k, k);
  ctx.drawImage(sp.img, -sp.ax, -sp.ay);
  ctx.restore();
}

/** Draw one full frame. World objects are painted far to near. */
function render() {
  drawBackdrop(); // the sky stays still; everything on the ground shakes
  ctx.save();
  if (fx.shakeT > 0) {
    const k = fx.shakeT / CONFIG.shakeTime, a = CONFIG.shakeAmp * k * k;
    ctx.translate(Math.sin(fx.shakeT * 93) * a, Math.cos(fx.shakeT * 71) * a);
  }
  drawGround();
  drawGrassBands();
  drawRoad();
  drawPathDetails();
  // haze toward the horizon over the ground and path
  const hz = ctx.createLinearGradient(0, view.horizonY, 0, view.horizonY + view.h * 0.12);
  hz.addColorStop(0, CONFIG.colors.haze);
  hz.addColorStop(1, "rgba(214, 238, 200, 0)");
  ctx.fillStyle = hz;
  ctx.fillRect(-20, view.horizonY, view.w + 40, view.h * 0.12);
  const items = [];
  for (const o of state.obstacles) {
    const z = o.wz - state.scroll;
    if (z <= 0 || z >= CONFIG.viewDepth) continue;
    const alpha = Math.max(0, Math.min(1, (CONFIG.spawnAhead - z) / CONFIG.fadeInDepth));
    items.push({ z, draw: () => { ctx.globalAlpha = alpha; OBSTACLE_DRAW[o.type](o.lane, z); ctx.globalAlpha = 1; } });
  }
  for (const t of state.treats) {
    const z = t.wz - state.scroll;
    if (z <= 0 || z >= CONFIG.viewDepth) continue;
    const alpha = Math.max(0, Math.min(1, (CONFIG.spawnAhead - z) / CONFIG.fadeInDepth));
    items.push({ z, draw: () => { ctx.globalAlpha = alpha; drawBone(t.lane, z, t.wz); ctx.globalAlpha = 1; } });
  }
  for (const t of state.penguins) {
    const z = t.wz - state.scroll;
    if (z <= 0 || z >= CONFIG.viewDepth) continue;
    const alpha = Math.max(0, Math.min(1, (CONFIG.spawnAhead - z) / CONFIG.fadeInDepth));
    items.push({ z, draw: () => { ctx.globalAlpha = alpha; drawPenguin(t.lane, z, t.wz); ctx.globalAlpha = 1; } });
  }
  for (const it of sceneryItems()) {
    const haze = Math.max(0, Math.min(1, (it.z - CONFIG.hazeFrom) / (CONFIG.sceneryDepth - CONFIG.hazeFrom))) * CONFIG.hazeMax;
    items.push({ z: it.z, draw: () => { ctx.globalAlpha = 1 - haze; SCENERY_DRAW[it.type](it); ctx.globalAlpha = 1; } });
  }
  items.push({ z: CONFIG.dogZ, draw: drawPlayer });
  items.sort((a, b) => b.z - a.z);
  for (const it of items) it.draw();
  drawPops();
  ctx.restore();
}


/* ==========================================================================
   5. INPUT — swipe / tap / keyboard → moveLane() and jump()
   Pointer Events cover touch, mouse and pen with one code path, so a single
   physical gesture can never fire twice. Keyboard is a separate device.
   ========================================================================== */

/**
 * Classify a finished or in-progress touch. Pure, so the rules are easy to tweak.
 * @param {number} dx  horizontal travel in px (right positive)
 * @param {number} dy  vertical travel in px (down positive)
 * @param {number} dtMs touch duration in ms
 * @param {boolean} ended true on release, false while the finger is still down
 * @returns {"left"|"right"|"up"|"down"|"tap"|null} null = not decided yet / ignored
 */
function classifyGesture(dx, dy, dtMs, ended) {
  const dist = Math.hypot(dx, dy);
  if (dist >= CONFIG.swipeMinDist) {
    // Dominant axis wins.
    if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? "left" : "right";
    return dy < 0 ? "up" : "down";
  }
  if (ended && dtMs <= CONFIG.tapMaxMs) return "tap";
  return null;
}

/** Route a classified gesture to an action. */
function applyGesture(g) {
  if (g === "left") moveLane(-1);
  else if (g === "right") moveLane(1);
  else if (g === "up" || g === "tap") jump();
  // "down" intentionally does nothing (no slide/duck in the MVP)
}

const touch = { id: null, x: 0, y: 0, t: 0, fired: false };

function onPointerDown(e) {
  e.preventDefault();
  if (touch.id !== null) return; // one finger drives the dog
  touch.id = e.pointerId;
  touch.x = e.clientX;
  touch.y = e.clientY;
  touch.t = e.timeStamp;
  touch.fired = false;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
  // On Title / Game Over the touch belongs to the screen; it must not also become a jump.
  if (ui.screen !== "playing") { touch.fired = true; screenPointer(e.clientX, e.clientY); }
}

function onPointerMove(e) {
  if (e.pointerId !== touch.id || touch.fired) return;
  // Decide a swipe the moment it passes the threshold: responsive, no wait for release.
  const g = classifyGesture(e.clientX - touch.x, e.clientY - touch.y, e.timeStamp - touch.t, false);
  if (g) { touch.fired = true; applyGesture(g); }
}

function onPointerUp(e) {
  if (e.pointerId !== touch.id) return;
  if (!touch.fired) {
    applyGesture(classifyGesture(e.clientX - touch.x, e.clientY - touch.y, e.timeStamp - touch.t, true));
  }
  touch.id = null;
}

function onPointerCancel(e) {
  if (e.pointerId === touch.id) touch.id = null;
}

function onKeyDown(e) {
  if (e.repeat) return; // holding a key must not spam moves
  if (ui.screen !== "playing") {
    if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") { e.preventDefault(); screenAction(); }
    return;
  }
  switch (e.code) {
    case "ArrowLeft": case "KeyA": moveLane(-1); break;
    case "ArrowRight": case "KeyD": moveLane(1); break;
    case "ArrowUp": case "KeyW": case "Space": jump(); break;
    default: return;
  }
  e.preventDefault();
}

/** Wire all listeners. `passive: false` is needed so preventDefault can stop scrolling on older iOS. */
function initInput() {
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerCancel);
  window.addEventListener("keydown", onKeyDown);
  // No page scroll, pull-to-refresh or pinch zoom while playing.
  const stop = (e) => e.preventDefault();
  document.addEventListener("touchstart", stop, { passive: false });
  document.addEventListener("touchmove", stop, { passive: false });
  document.addEventListener("gesturestart", stop);   // iOS Safari pinch
  document.addEventListener("dblclick", stop);       // double-tap zoom fallback
  document.addEventListener("contextmenu", stop);    // long-press menu
  document.addEventListener("wheel", stop, { passive: false });
}


/* ==========================================================================
   5b. MOVEMENT — lane slide and jump (driven by input, advanced by update())
   ========================================================================== */

/**
 * Change lane by one step. Clamped to the track. A second move while a slide
 * is running is buffered (up to CONFIG.inputBuffer) and replayed when it ends.
 * @param {-1|1} dir  -1 = left, +1 = right
 */
function moveLane(dir) {
  if (!state.running) return;
  const sliding = state.slideT < 1;
  // Clamp against where the dog is heading, including already-queued moves.
  const heading = state.lane + state.queue.reduce((a, b) => a + b, 0);
  const next = heading + dir;
  if (next < 0 || next > CONFIG.lanes - 1) return;
  if (sliding) {
    if (state.queue.length < CONFIG.inputBuffer) state.queue.push(dir);
    return;
  }
  startSlide(dir);
}

function startSlide(dir) {
  state.slideFrom = state.laneVis;
  state.lane += dir;
  state.slideT = 0;
}

/** Jump if on the ground. No double jump while airborne. */
function jump() {
  if (!state.running) return;
  if (!state.grounded) return;
  state.grounded = false;
  state.jumpT = 0;
}

/** Gravity implied by the tunables: peak h at T/2 gives g = 8h / T². */
function jumpGravity() {
  return (8 * CONFIG.jumpHeight) / (CONFIG.jumpAirtime * CONFIG.jumpAirtime);
}

/** World distance (z units) covered while airborne at a given speed. */
function jumpAirDistance(speed) {
  return speed * CONFIG.jumpAirtime;
}

/** Advance slide and jump by dt seconds. */
function updateMovement(dt) {
  if (state.slideT < 1) {
    state.slideT = Math.min(1, state.slideT + dt / CONFIG.laneSlideTime);
    const e = state.slideT * state.slideT * (3 - 2 * state.slideT); // smoothstep ease
    state.laneVis = state.slideFrom + (state.lane - state.slideFrom) * e;
    if (state.slideT >= 1) {
      state.laneVis = state.lane;
      const next = state.queue.shift();
      if (next !== undefined) startSlide(next);
    }
  }
  if (!state.grounded) {
    state.jumpT += dt;
    const u = state.jumpT / CONFIG.jumpAirtime;
    if (u >= 1) {
      state.grounded = true;
      state.jumpT = 0;
      state.jumpY = 0;
      state.landT = 0;
    } else {
      // Exact parabola under constant gravity: y = 4 h u (1 - u).
      state.jumpY = 4 * CONFIG.jumpHeight * u * (1 - u);
    }
  }
}


/* ==========================================================================
   6. SPAWNING — story 003 (obstacles) and story 005 (treats)
   ========================================================================== */
/*
 * Fairness model. Obstacles come in rows. A lane is "passable" in a row if it is
 * empty or holds only a low (jumpable) obstacle. A row is accepted only if:
 *   1. it has at least one passable lane (never 3 crates), and
 *   2. EVERY passable lane of the previous row is within CONFIG.laneReach of a
 *      passable lane of this row — wherever the player went, a way on exists.
 * Row spacing in time is never below one slide or one jump plus reaction margin,
 * so the player always has time to make the move the rule assumes.
 */

/** Small seedable PRNG (mulberry32) so runs and the fairness check are reproducible. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Current forward speed for a run time, unless a debug speed is fixed. */
function speedAt(t) {
  return Math.min(CONFIG.maxSpeed, CONFIG.baseSpeed + CONFIG.speedRamp * t);
}

/** Difficulty 0..1 from the current speed. */
function difficulty(speed) {
  return Math.max(0, Math.min(1, (speed - CONFIG.baseSpeed) / (CONFIG.maxSpeed - CONFIG.baseSpeed)));
}

/** Shortest safe time between rows: one jump or the lane moves the rule assumes, plus margin. */
function minSafeGapTime() {
  return Math.max(CONFIG.jumpAirtime, CONFIG.laneSlideTime * CONFIG.laneReach) + CONFIG.rowSafetyMargin;
}

/** Seconds between rows at a difficulty (denser as difficulty rises, never below the safe gap). */
function rowGapTime(d) {
  const t = CONFIG.rowGapTimeStart + (CONFIG.rowGapTimeMin - CONFIG.rowGapTimeStart) * d;
  return Math.max(t, minSafeGapTime());
}

/** Lanes of a row that can be passed (empty or low obstacle). */
function passableLanes(row) {
  return row.map((t, i) => (t === null || CONFIG.obstacleTypes[t].low ? i : -1)).filter((i) => i >= 0);
}

/** Fairness rule (see model above). */
function isRowFair(prevPassable, row) {
  const pass = passableLanes(row);
  if (pass.length === 0) return false;
  return prevPassable.every((p) => pass.some((q) => Math.abs(p - q) <= CONFIG.laneReach));
}

/**
 * Generate one obstacle row. Pure given the rng.
 * @param {number[]} prevPassable passable lanes of the previous row
 * @param {number} d difficulty 0..1
 * @param {() => number} rng
 * @returns {(string|null)[]} obstacle type per lane, null = empty
 */
function generateRow(prevPassable, d, rng) {
  const { start, end } = CONFIG.rowCountOdds;
  const odds = start.map((v, i) => v + (end[i] - v) * d);
  for (let attempt = 0; attempt < 30; attempt++) {
    let r = rng(), count = 1;
    for (let i = 0; i < odds.length; i++) { if (r < odds[i]) { count = i + 1; break; } r -= odds[i]; }
    const order = allLanes();
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const row = allLanes().map(() => null);
    const pick = (list) => list[Math.floor(rng() * list.length)];
    for (let i = 0; i < count; i++) row[order[i]] = rng() < CONFIG.crateShare ? pick(CONFIG.tallTypes) : pick(CONFIG.lowTypes);
    if (isRowFair(prevPassable, row)) return row;
  }
  return allLanes().map(() => null); // an empty row is always fair
}

/**
 * A line of banana penguin treats in the gap after an obstacle row, in one lane the player can be in.
 * It starts clear of this row and ends early enough to leave the lane before the
 * next row (one slide plus reaction margin), so a treat line is a temptation, never a trap.
 * @returns {{lane:number, wz:number}[]} empty when the gap is too short for the minimum line
 */
function generateTreatLine(rowWz, gapZ, lanes, speed, rng) {
  const start = rowWz + CONFIG.treatClearance;
  const end = rowWz + gapZ - CONFIG.treatClearance - speed * (CONFIG.laneSlideTime + CONFIG.rowSafetyMargin);
  const fit = Math.floor((end - start) / CONFIG.treatSpacing) + 1;
  const max = Math.min(CONFIG.treatMaxCount, fit);
  if (max < CONFIG.treatMinCount) return [];
  const n = CONFIG.treatMinCount + Math.floor(rng() * (max - CONFIG.treatMinCount + 1));
  const lane = lanes[Math.floor(rng() * lanes.length)];
  return Array.from({ length: n }, (_, i) => ({ lane, wz: start + i * CONFIG.treatSpacing }));
}

/** Spawn rows up to CONFIG.spawnAhead and drop obstacles that passed the camera. */
function updateSpawning() {
  if (state.spawnEnabled) {
    while (state.nextRowWz < state.scroll + CONFIG.spawnAhead) {
      const d = difficulty(state.speed);
      const row = generateRow(state.prevPassable, d, state.rng);
      row.forEach((type, lane) => { if (type) state.obstacles.push({ type, lane, wz: state.nextRowWz }); });
      const pass = passableLanes(row);
      state.prevPassable = pass;
      state.reach = pass.filter((q) => state.reach.some((p) => Math.abs(p - q) <= CONFIG.laneReach));
      const gapZ = state.speed * rowGapTime(d);
      let placedLine = false;
      if (state.reach.length > 0 && state.rng() < CONFIG.treatLineChance) {
        const line = generateTreatLine(state.nextRowWz, gapZ, state.reach, state.speed, state.rng);
        state.treats.push(...line);
        placedLine = line.length > 0;
      }
      // banana penguin: rare, alone in the middle of a gap, in a lane the player can reach
      if (!placedLine && state.reach.length > 0 && state.nextRowWz >= state.nextPenguinWz && state.rng() < CONFIG.penguin.chance) {
        state.penguins.push({ lane: state.reach[Math.floor(state.rng() * state.reach.length)], wz: state.nextRowWz + gapZ * 0.5 });
        state.nextPenguinWz = state.nextRowWz + CONFIG.penguin.minSpacing;
      }
      state.nextRowWz += gapZ;
    }
  }
  state.obstacles = state.obstacles.filter((o) => o.wz - state.scroll > CONFIG.despawnBehind);
  state.treats = state.treats.filter((t) => t.wz - state.scroll > CONFIG.despawnBehind);
  state.penguins = state.penguins.filter((t) => t.wz - state.scroll > CONFIG.despawnBehind);
}

/**
 * Self-check: generate many rows and confirm a path always exists.
 * @returns {{rows:number, ok:boolean, failures:string[]}}
 */
function fairnessSelfTest(rows = 20000, seed = 1) {
  const rng = mulberry32(seed);
  const failures = [];
  for (const d of [0, 0.5, 1]) {
    let prev = allLanes(), reach = allLanes();
    for (let i = 0; i < rows; i++) {
      const row = generateRow(prev, d, rng);
      const pass = passableLanes(row);
      if (row.every((t) => t === "crate")) failures.push(`d=${d} row ${i}: all crates`);
      // Independent check: lanes reachable by a player who started anywhere.
      reach = pass.filter((q) => reach.some((p) => Math.abs(p - q) <= CONFIG.laneReach));
      if (reach.length === 0) failures.push(`d=${d} row ${i}: no reachable lane`);
      prev = pass;
    }
  }
  if (rowGapTime(1) < minSafeGapTime()) failures.push("row gap below safe minimum");
  for (const t of Object.keys(CONFIG.obstacleTypes)) {
    if (CONFIG.obstacleTypes[t].low && !canClearLow(t, CONFIG.maxSpeed)) failures.push(`${t} not clearable at maxSpeed`);
    if (!CONFIG.obstacleTypes[t].low && CONFIG.obstacleTypes[t].h <= CONFIG.jumpHeight) failures.push(`${t} is jumpable but not marked low`);
  }
  return { rows: rows * 3, ok: failures.length === 0, failures: failures.slice(0, 10) };
}


/* ==========================================================================
   7. COLLISION
   ========================================================================== */

/**
 * Does the dog overlap an obstacle? Pure.
 * @param {string} type obstacle type
 * @param {number} obLane obstacle lane
 * @param {number} obZ obstacle depth (z) relative to the camera
 * @param {number} dogLane dog lane position (float while sliding)
 * @param {number} dogY dog height above ground, lane widths
 */
function hitTest(type, obLane, obZ, dogLane, dogY) {
  const T = CONFIG.obstacleTypes[type];
  if (Math.abs(obZ - CONFIG.dogZ) > (T.d + CONFIG.dogDepth) / 2) return false;
  if (Math.abs(dogLane - obLane) >= CONFIG.dogHalfWidth + T.w / 2) return false;
  return dogY < T.h;
}

/**
 * Can a jump clear a low obstacle at this speed? The dog stays above height h for
 * T·sqrt(1 − h/H) seconds; that must exceed the overlap time plus 0.1 s of timing slack.
 */
function canClearLow(type, speed) {
  const T = CONFIG.obstacleTypes[type];
  if (T.h >= CONFIG.jumpHeight) return false;
  const above = CONFIG.jumpAirtime * Math.sqrt(1 - T.h / CONFIG.jumpHeight);
  const overlap = (T.d + CONFIG.dogDepth) / speed;
  return above > overlap + 0.1;
}

/** Hooks for other systems (screens, juice). */
const events = { onCrash: [], onTreat: [], onPenguin: [] };

/** Collect treats the dog runs through. A treat never ends the run. */
function updateTreats() {
  const keep = [];
  for (const t of state.treats) {
    const z = t.wz - state.scroll;
    const hit = Math.abs(z - CONFIG.dogZ) < (CONFIG.treatDepth + CONFIG.dogDepth) / 2
      && Math.abs(state.laneVis - t.lane) < CONFIG.treatPickupHalfWidth
      && state.jumpY < CONFIG.treatMissHeight;
    if (!hit) { keep.push(t); continue; }
    state.treatPoints += CONFIG.treatValue;
    state.treatCount += 1;
    for (const fn of events.onTreat) fn(t, z);
  }
  state.treats = keep;
  const P = CONFIG.penguin;
  state.penguins = state.penguins.filter((t) => {
    const z = t.wz - state.scroll;
    const hit = Math.abs(z - CONFIG.dogZ) < (P.depth + CONFIG.dogDepth) / 2
      && Math.abs(state.laneVis - t.lane) < P.pickupHalfWidth
      && state.jumpY < P.missHeight;
    if (!hit) return true;
    state.treatPoints += P.value;
    state.penguinCount += 1;
    for (const fn of events.onPenguin) fn(t, z);
    return false;
  });
}

/** End the run on the first hit. */
function updateCollision() {
  for (const o of state.obstacles) {
    if (hitTest(o.type, o.lane, o.wz - state.scroll, state.laneVis, state.jumpY)) {
      state.running = false;
      state.crashed = true;
      state.crashedOn = o.type;
      for (const fn of events.onCrash) fn(o);
      return;
    }
  }
}


/* ==========================================================================
   8. SCREENS — Title, Play HUD, Game Over (drawn on the canvas)
   ========================================================================== */

/** Screen state lives outside `state` so a run reset never wipes the session best. */
const ui = {
  screen: "title",      // "title" | "playing" | "gameover"
  best: 0,              // session best (memory only — no save system)
  lastScore: 0,
  newBest: false,
  gameOverAt: 0,        // performance.now() when Game Over appeared
  buttons: [],          // hit regions drawn this frame: { id, x, y, w, h }
};

/** Live score: distance travelled plus treat bonus. */
function currentScore() {
  return Math.floor(state.scroll * CONFIG.scorePerZ) + state.treatPoints;
}

/** Start a fresh run (from Title or Try Again). Never reloads the page. */
function startRun() {
  resetRun(debug.seed);
  fx.shakeT = 0;
  fx.pops = [];
  fx.cardT = Infinity;
  resetRigAnim();
  touch.id = null;
  ui.screen = "playing";
}

/** Crash handler: freeze the score and show Game Over. */
function showGameOver() {
  ui.lastScore = currentScore();
  ui.newBest = ui.lastScore > ui.best;
  ui.best = Math.max(ui.best, ui.lastScore);
  ui.gameOverAt = performance.now();
  ui.screen = "gameover";
}

/** Keyboard or tap anywhere: the screen's main action. */
function screenAction() {
  if (ui.screen === "title") startRun();
  else if (ui.screen === "gameover" && performance.now() - ui.gameOverAt >= CONFIG.gameOverInputDelayMs) startRun();
}

/** Pointer on a non-play screen: Title starts on any tap, Game Over only via its button. */
function screenPointer(x, y) {
  if (ui.screen === "title") { startRun(); return; }
  if (ui.screen !== "gameover") return;
  if (performance.now() - ui.gameOverAt < CONFIG.gameOverInputDelayMs) return;
  const b = ui.buttons.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (b && b.id === "retry") startRun();
}

function uiFont(px, weight = 800) {
  return `${weight} ${Math.round(px)}px ${CONFIG.font}`;
}

/** Text with a soft outline, for titles over the busy track. */
function outlinedText(str, x, y, px, fill, stroke) {
  ctx.font = uiFont(px, 900);
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(3, px * 0.16);
  ctx.strokeStyle = stroke;
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

/** A rounded pill button with a pressed-look base; registers its hit region. */
function drawButton(id, label, cx, cy, w, h) {
  const C = CONFIG.colors;
  ctx.fillStyle = C.uiAccentDark;
  roundRectPath(cx - w / 2, cy - h / 2 + h * 0.09, w, h, h / 2);
  ctx.fill();
  ctx.fillStyle = C.uiAccent;
  roundRectPath(cx - w / 2, cy - h / 2, w, h, h / 2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.font = uiFont(h * 0.42, 900);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, cx, cy + h * 0.02);
  ui.buttons.push({ id, x: cx - w / 2, y: cy - h / 2, w, h: h * 1.09 });
}

/** Live score pill in the top-right corner, clear of the notch. */
function drawHud() {
  const C = CONFIG.colors;
  const px = Math.max(18, Math.min(34, view.w * 0.065));
  const label = String(currentScore());
  ctx.font = uiFont(px, 900);
  const w = Math.max(px * 3, ctx.measureText(label).width + px * 1.4);
  const h = px * 1.6;
  const x = view.w - view.safe.right - 12 - w;
  const y = view.safe.top + 12;
  ctx.save();
  if (fx.hudPopT < CONFIG.hudPopTime) { // bump when a treat lands in the score
    const k = 1 + 0.15 * Math.sin(Math.PI * (fx.hudPopT / CONFIG.hudPopTime));
    ctx.translate(x + w / 2, y + h / 2); ctx.scale(k, k); ctx.translate(-(x + w / 2), -(y + h / 2));
  }
  ctx.fillStyle = "rgba(255, 246, 230, 0.92)";
  roundRectPath(x, y, w, h, h / 2);
  ctx.fill();
  ctx.fillStyle = C.uiText;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + px * 0.04);
  ctx.restore();
}

function drawTitle(now) {
  const C = CONFIG.colors;
  const cx = view.w / 2;
  const big = Math.max(40, Math.min(84, view.w * 0.15));
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  outlinedText(CONFIG.text.title, cx, view.safe.top + view.h * 0.16, big, C.uiAccent, C.uiPanel);
  const pulse = 0.75 + 0.25 * Math.sin(now / 280); // gentle pulse, never too faint to read
  ctx.globalAlpha = pulse;
  outlinedText(CONFIG.text.tapToStart, cx, view.safe.top + view.h * 0.16 + big * 1.05, big * 0.42, C.uiText, C.uiPanel);
  ctx.globalAlpha = 1;
  const hintPx = Math.max(12, Math.min(18, view.w * 0.037));
  ctx.font = uiFont(hintPx, 700);
  const hw = Math.min(view.w - 32, ctx.measureText(CONFIG.text.hint).width + hintPx * 2);
  const hy = view.h - view.safe.bottom - hintPx * 3.2;
  ctx.fillStyle = "rgba(255, 246, 230, 0.9)";
  roundRectPath(cx - hw / 2, hy - hintPx, hw, hintPx * 2, hintPx);
  ctx.fill();
  ctx.fillStyle = C.uiText;
  ctx.fillText(CONFIG.text.hint, cx, hy + hintPx * 0.05, view.w - 48);
}

function drawGameOver(now) {
  const C = CONFIG.colors;
  ctx.fillStyle = C.uiShade;
  ctx.fillRect(0, 0, view.w, view.h);
  const pw = Math.min(view.w - 32, 360);
  const unit = pw / 10;
  const ph = unit * 8.4;
  const px0 = (view.w - pw) / 2;
  const py0 = Math.max(view.safe.top + 16, (view.h - ph) / 2 - unit);
  const cx = view.w / 2;
  ctx.fillStyle = C.uiPanel;
  roundRectPath(px0, py0, pw, ph, unit * 0.9);
  ctx.fill();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = C.uiText;
  ctx.font = uiFont(unit * 1.05, 900);
  ctx.fillText(CONFIG.text.gameOver, cx, py0 + unit * 1.2);
  ctx.fillStyle = C.uiTextSoft;
  ctx.font = uiFont(unit * 0.55, 800);
  ctx.fillText(CONFIG.text.score.toUpperCase(), cx, py0 + unit * 2.35);
  ctx.fillStyle = C.uiText;
  ctx.font = uiFont(unit * 1.7, 900);
  ctx.fillText(String(ui.lastScore), cx, py0 + unit * 3.45);
  ctx.fillStyle = C.uiTextSoft;
  ctx.font = uiFont(unit * 0.55, 800);
  ctx.fillText(`${CONFIG.text.best.toUpperCase()}  ${ui.best}`, cx, py0 + unit * 4.6);
  if (ui.newBest) {
    const bw = unit * 3.6, bh = unit * 0.8, by = py0 + unit * 5.45;
    ctx.fillStyle = C.uiBadge;
    roundRectPath(cx - bw / 2, by - bh / 2, bw, bh, bh / 2);
    ctx.fill();
    ctx.fillStyle = C.uiText;
    ctx.font = uiFont(unit * 0.45, 900);
    ctx.fillText(CONFIG.text.newBest, cx, by + unit * 0.02);
  }
  const ready = now - ui.gameOverAt >= CONFIG.gameOverInputDelayMs;
  ctx.globalAlpha = ready ? 1 : 0.55;
  const bh = Math.max(CONFIG.buttonMinHeight, unit * 1.5);
  drawButton("retry", CONFIG.text.tryAgain, cx, py0 + ph - bh * 0.5 - unit * 0.7, pw - unit * 1.6, bh);
  ctx.globalAlpha = 1;
}

/** Draw the overlay for the current screen. */
function drawScreens(now = performance.now()) {
  ui.buttons = [];
  if (ui.screen === "title") drawTitle(now);
  else if (ui.screen === "playing") { drawPenguinCard(); drawHud(); }
  else if (ui.screen === "gameover") drawGameOver(now);
}


/* ==========================================================================
   8b. JUICE — landing squash, crash shake, treat pop. Purely cosmetic:
   nothing here changes hitboxes, timing or score.
   ========================================================================== */
const fx = { shakeT: 0, pops: [], hudPopT: Infinity, crashAt: 0, cardT: Infinity };

/** Crash: shake now, show Game Over a beat later. */
function onCrashFx() {
  fx.shakeT = CONFIG.shakeTime;
  fx.crashAt = performance.now();
}

/** Gingu pickup: a big pop at the dog and the "Gingu acquired!" card. */
function onPenguinFx() {
  fx.pops.push({ lane: state.laneVis, y: state.jumpY, t: 0, value: CONFIG.penguin.value });
  fx.hudPopT = 0;
  fx.cardT = 0;
}

/**
 * The "Gingu acquired!" card: pops in with a little overshoot under the score pill,
 * shows the penguin and its points, then fades. The run keeps going underneath.
 */
function drawPenguinCard() {
  const P = CONFIG.penguin, C = CONFIG.colors;
  const t = fx.cardT;
  if (!(t < P.cardTime)) return;
  const sp = SPRITES.banana_penguin;
  const w = Math.min(view.w - 32, 340), h = Math.max(96, Math.min(124, view.w * 0.3));
  const x = (view.w - w) / 2;
  const y = view.safe.top + 12 + Math.max(18, Math.min(34, view.w * 0.065)) * 1.6 + 14;
  const inK = Math.min(1, t / 0.3);
  const scale = inK < 1 ? 0.6 + 0.4 * (1 - Math.pow(1 - inK, 3)) * (1 + 0.12 * Math.sin(inK * Math.PI)) : 1;
  const alpha = t > P.cardTime - 0.35 ? (P.cardTime - t) / 0.35 : Math.min(1, t / 0.12);
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.translate(view.w / 2, y + h / 2);
  ctx.scale(scale, scale);
  ctx.translate(-view.w / 2, -(y + h / 2));
  ctx.fillStyle = "rgba(90, 40, 10, 0.25)";
  roundRectPath(x, y + 5, w, h, 22);
  ctx.fill();
  ctx.fillStyle = C.uiPanel;
  roundRectPath(x, y, w, h, 22);
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = C.cardBorder;
  ctx.stroke();
  // the penguin, big, gently rocking
  if (sp && sp.img.complete && sp.img.naturalWidth) {
    const ih = h * 0.9, k = ih / sp.h;
    ctx.save();
    ctx.translate(x + h * 0.42, y + h * 0.95);
    ctx.rotate(Math.sin(t * 6) * 0.08);
    ctx.scale(k, k);
    ctx.drawImage(sp.img, -sp.ax, -sp.ay);
    ctx.restore();
  }
  const tx = x + h * 0.85, room = w - h * 0.85 - 14;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  let px = h * 0.24;
  ctx.font = uiFont(px, 900);
  const tw = ctx.measureText(CONFIG.text.penguinTitle).width;
  if (tw > room) { px *= room / tw; ctx.font = uiFont(px, 900); }
  ctx.fillStyle = C.uiText;
  ctx.fillText(CONFIG.text.penguinTitle, tx, y + h * 0.36);
  ctx.font = uiFont(h * 0.15, 800);
  ctx.fillStyle = C.uiTextSoft;
  ctx.fillText(CONFIG.text.penguinSub, tx, y + h * 0.62);
  const subW = ctx.measureText(CONFIG.text.penguinSub).width;
  ctx.font = uiFont(h * 0.21, 900);
  ctx.fillStyle = C.uiAccent;
  ctx.fillText(`+${P.value}`, tx + subW + 10, y + h * 0.61);
  ctx.restore();
}

/** Treat pickup: a pop at the dog and a bump on the score pill. */
function onTreatFx() {
  fx.pops.push({ lane: state.laneVis, y: state.jumpY, t: 0, value: CONFIG.treatValue });
  fx.hudPopT = 0;
}

/** Advance all effects; runs every frame, even after a crash. */
function updateEffects(dt, now) {
  fx.shakeT = Math.max(0, fx.shakeT - dt);
  fx.hudPopT += dt;
  fx.cardT += dt;
  for (const p of fx.pops) p.t += dt;
  fx.pops = fx.pops.filter((p) => p.t < CONFIG.popTime);
  // landing squash: strongest at touch-down, eased back to 1
  if (state.running) state.landT += dt;
  const e = state.landT < CONFIG.squashTime ? (1 - state.landT / CONFIG.squashTime) ** 2 : 0;
  state.squashY = 1 - (1 - CONFIG.squashY) * e;
  state.squashX = 1 + (CONFIG.squashX - 1) * e;
  if (state.crashed && ui.screen === "playing" && now - fx.crashAt >= CONFIG.crashToGameOverMs) showGameOver();
  updateRig(dt);
}

/** Draw treat pops: a ring, a few sparkles and a rising "+10". */
function drawPops() {
  const C = CONFIG.colors;
  for (const pop of fx.pops) {
    const k = pop.t / CONFIG.popTime;
    const p = project(laneToX(pop.lane), CONFIG.dogZ + 0.15);
    const u = view.laneW * p.s;
    const cx = p.x, cy = p.y - (0.55 + pop.y) * u;
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = C.uiBadge;
    ctx.lineWidth = Math.max(2, u * 0.05 * (1 - k));
    ctx.beginPath(); ctx.arc(cx, cy, u * (0.12 + 0.35 * k), 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = C.treatSparkle;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.4, r = u * (0.15 + 0.45 * k);
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, u * 0.035 * (1 - k * 0.5), 0, Math.PI * 2); ctx.fill();
    }
    ctx.font = uiFont(Math.max(14, u * 0.32), 900);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(3, u * 0.06);
    ctx.strokeStyle = C.uiText;
    const ty = cy - u * (0.35 + 0.5 * k);
    ctx.strokeText(`+${pop.value}`, cx, ty);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(`+${pop.value}`, cx, ty);
    ctx.globalAlpha = 1;
  }
}


/* ==========================================================================
   9. GAME LOOP — requestAnimationFrame with clamped dt
   ========================================================================== */
let lastTime = null;

/** Advance the simulation by dt seconds. */
function update(dt) {
  if (ui.screen === "title") { // track drifts behind the title, no obstacles
    state.scroll += CONFIG.baseSpeed * CONFIG.titleScrollFactor * dt;
    state.runPhase += dt * CONFIG.strideRate * 0.6;
    return;
  }
  if (!state.running) return;
  state.time += dt;
  if (!Number.isFinite(debug.speed)) state.speed = speedAt(state.time);
  state.scroll += state.speed * dt;
  state.runPhase += dt * CONFIG.strideRate * Math.sqrt(state.speed / CONFIG.baseSpeed);
  const laneBefore = state.laneVis;
  updateMovement(dt);
  if (dt > 0) {
    const lean = Math.max(-CONFIG.tiltMax, Math.min(CONFIG.tiltMax, ((state.laneVis - laneBefore) / dt) * CONFIG.tiltPerLaneSpeed));
    state.tilt += (lean - state.tilt) * Math.min(1, dt * 14);
  }
  updateSpawning();
  updateTreats();
  updateCollision();
}

function frame(now) {
  // First frame after start or a hidden tab: dt = 0, so no time jump.
  const dt = lastTime === null ? 0 : Math.min((now - lastTime) / 1000, CONFIG.maxDt);
  lastTime = now;
  update(dt);
  updateEffects(dt, now);
  render();
  drawScreens(now);
  requestAnimationFrame(frame);
}

document.addEventListener("visibilitychange", () => { lastTime = null; });


/* ==========================================================================
   10. BOOT
   ========================================================================== */
resetRun(debug.seed);
ui.screen = debug.play ? "playing" : "title";
events.onCrash.push(onCrashFx);
events.onCrash.push(onCrashRig);
events.onTreat.push(onTreatFx);
events.onPenguin.push(onPenguinFx);
// Exposed for debugging and tools/qa checks.
window.CaiusRun = {
  CONFIG, state, view, events, project, classifyGesture, moveLane, jump, jumpGravity, jumpAirDistance,
  ui, fx, rigAnim, _sitRigPose: sitRigPose, startRun, currentScore, resetRun, generateRow, generateTreatLine, isRowFair, passableLanes, fairnessSelfTest, hitTest, canClearLow, speedAt,
  rowGapTime, minSafeGapTime, mulberry32, _updateSpawning: updateSpawning, _render: render,
};

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();
initInput();
requestAnimationFrame(frame);
</script>
</body>
